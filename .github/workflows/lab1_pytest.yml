name: Lab 1 - Testing with Pytest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lab1/**", ".github/workflows/lab1_pytest.yml"]
  pull_request:
    branches: [main]
    paths: ["lab1/**", ".github/workflows/lab1_pytest.yml"]

defaults:
  run:
    working-directory: lab1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 src test --max-line-length=100

      - name: Run tests and generate XML report
        run: python -m pytest test/test_pytest.py --junitxml=pytest-report.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab1-test-results-py${{ matrix.python-version }}
          path: lab1/pytest-report.xml

      - name: Notify on success
        if: success()
        run: echo "Tests passed successfully on Python ${{ matrix.python-version }}"

      - name: Notify on failure
        if: failure()
        run: echo "Tests failed on Python ${{ matrix.python-version }}"
